name: Refresh schedule snapshots
on:
  schedule:
    # First of each month, 06:15 UTC (01:15 EST / 02:15 EDT).
    - cron: '15 6 1 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: schedule-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run refresh:schedules
      - run: npm run typecheck && npm test && npm run build
      - name: Commit validated monthly templates
        run: |
          if git diff --quiet -- public/data; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/subway-schedule.json public/data/ferry-schedule.json public/data/route-meta.json public/data/transit-bundle.json
          git commit -m 'Refresh monthly transit templates'
          git push
